[project]
name = "r7b"
version = "0.1.0"
description = "A learned router that decides when Cohere Command R7B is good enough and when a query needs Command A."
readme = "README.md"
authors = [
    { name = "abrj7", email = "68309049+abrj7@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.1.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
r7b = "r7b.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
